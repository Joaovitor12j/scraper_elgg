name: Scraping Google Scholar

on:
  workflow_dispatch:
    inputs:
      user_guid:
        description: 'GUID do usuário no Elgg'
        required: true
        type: string
      scholar_name:
        description: 'Nome do autor no Google Scholar'
        required: true
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar scraper
        env:
          SCRAPING_API_KEY: ${{ secrets.SCRAPING_API_KEY }}
        run: |
          python scrapingdog-academico.py \
            --user-guid "${{ inputs.user_guid }}" \
            --author "${{ inputs.scholar_name }}" \
            > output.json

      - name: Salvar artifact
        uses: actions/upload-artifact@v4
        with:
          name: scholar-${{ inputs.user_guid }}-${{ github.run_id }}
          path: output.json
          retention-days: 1
